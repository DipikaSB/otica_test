<!-- PhonePe Checkout Template -->
<div
    class="payment-method"
    data-bind="css: {'_active': (getCode() == isChecked())}"
>
    <div class="payment-method-title field choice">
        <input
            type="radio"
            name="payment[method]"
            class="radio"
            data-bind="attr: {id: getCode()}, value: getCode(), click: selectPaymentMethod, visible: isRadioButtonVisible()"
        />
        <label data-bind="attr: {for: getCode()}" class="label">
            <img
                data-bind="attr: {src: getLogoUrl(), alt: getTitle()}"
                class="payment-icon"
                width="40%"
                height="40%"
            />
        </label>
    </div>

    <div class="payment-method-content" data-bind="visible: isChecked">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button
                    class="action primary checkout"
                    type="submit"
                    data-bind="
                            click: placeOrder,
                            attr: {title: $t('Pay with PhonePe')},
                            css: {disabled: !isPlaceOrderActionAllowed()},
                            enable: (getCode() == isChecked())
                    "
                >
                    <span data-bind="i18n: 'Pay with PhonePe'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
